<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Elijah Ndeto — Senior Data Engineer, real-time streaming on GCP, Nairobi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#39FF88" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0">
      <stop offset="0" stop-color="#39FF88" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#39FF88" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#48A9FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#48A9FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2F8BFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <path id="pipe" d="M60 250 H1140"/>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#05060A"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#aura)"/>

  <!-- status chip -->
  <g transform="translate(60 52)">
    <rect width="232" height="28" rx="14" fill="#39FF88" fill-opacity="0.08" stroke="#39FF88" stroke-opacity="0.35"/>
    <circle cx="16" cy="14" r="4" fill="#39FF88">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1.5" fill="#39FF88">LIVE · STREAMING ON GCP</text>
  </g>

  <!-- name -->
  <text x="58" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="#F5F0E8" filter="url(#glow)">Elijah Ndeto</text>

  <!-- role line -->
  <text x="62" y="200" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="17" letter-spacing="3" fill="#8A9AB0">SENIOR DATA ENGINEER <tspan fill="#39FF88">/</tspan> REAL-TIME BI <tspan fill="#39FF88">/</tspan> NAIROBI</text>

  <!-- pipeline -->
  <use href="#pipe" stroke="url(#line)" stroke-width="1.5" fill="none"/>
  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2" fill="#5A6A7A" text-anchor="middle">
    <g transform="translate(240 250)"><circle r="5" fill="#05060A" stroke="#39FF88" stroke-opacity="0.7"/><text y="26">INGEST</text></g>
    <g transform="translate(480 250)"><circle r="5" fill="#05060A" stroke="#39FF88" stroke-opacity="0.7"/><text y="26">VALIDATE</text></g>
    <g transform="translate(720 250)"><circle r="5" fill="#05060A" stroke="#48A9FF" stroke-opacity="0.7"/><text y="26">MODEL</text></g>
    <g transform="translate(960 250)"><circle r="5" fill="#05060A" stroke="#48A9FF" stroke-opacity="0.7"/><text y="26">SERVE</text></g>
  </g>

  <!-- packets moving through the pipeline -->
  <g>
    <circle r="3" fill="#39FF88" filter="url(#soft)"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
    <circle r="2" fill="#39FF88"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
    <circle r="2" fill="#48A9FF"><animateMotion dur="5.6s" begin="1.1s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
    <circle r="2" fill="#6FE3FF"><animateMotion dur="3.4s" begin="2.3s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
    <circle r="1.6" fill="#F5F0E8" opacity="0.8"><animateMotion dur="6.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
    <circle r="2" fill="#39FF88"><animateMotion dur="4.9s" begin="3.2s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
  </g>

  <!-- corner signature -->
  <text x="1140" y="62" text-anchor="end" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="2" fill="#5A6A7A">EN<tspan fill="#39FF88">.</tspan></text>
</svg>
